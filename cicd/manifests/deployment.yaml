kind: Deployment
apiVersion: apps/v1
metadata:
  name: angular7-app
  namespace: angular-sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular7-app
  template:
    metadata:
      labels:
        app: angular7-app
    spec:
      containers:
        - name: container
          image: 'image-registry.openshift-image-registry.svc:5000/angular-sample-app/angular7-app'
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
