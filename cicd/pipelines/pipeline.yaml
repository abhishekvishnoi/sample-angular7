apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: sample-angular7-pipeline
  labels:
    app.kubernetes.io/part-of: sample-angular7
spec:
  description: Clone, build, and deploy sample-angular7 to OpenShift
  params:
    - name: git-url
      description: Git repository URL
      type: string
    - name: git-revision
      description: Git branch, tag, or commit
      type: string
      default: main
    - name: image-name
      description: Image name (without registry prefix)
      type: string
      default: sample-angular7
    - name: image-tag
      description: Image tag
      type: string
      default: latest
    - name: namespace
      description: Target OpenShift namespace
      type: string
      default: sample-angular7
    - name: app-name
      description: Application deployment name
      type: string
      default: sample-angular7
    - name: tls-verify
      description: TLS verification for registry push
      type: string
      default: "true"
  workspaces:
    - name: shared-workspace
      description: Shared workspace for source code and manifests
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build-image
      runAfter:
        - fetch-source
      taskRef:
        name: buildah-build-push
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/$(params.namespace)/$(params.image-name):$(params.image-tag)
        - name: DOCKERFILE
          value: Containerfile
        - name: CONTEXT
          value: .
        - name: TLSVERIFY
          value: $(params.tls-verify)
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: deploy
      runAfter:
        - build-image
      taskRef:
        name: deploy-openshift
      params:
        - name: NAMESPACE
          value: $(params.namespace)
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/$(params.namespace)/$(params.image-name):$(params.image-tag)
        - name: APP_NAME
          value: $(params.app-name)
        - name: MANIFESTS_DIR
          value: cicd/manifests
      workspaces:
        - name: source
          workspace: shared-workspace
